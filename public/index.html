<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Practice exam questions for driving tests, citizenship tests, and professional exams across North America."
  >
  <title>Exam Practice</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M4 5.5v16M8 7h8M8 11h8"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
      <span>Exam Practice</span>
    </a>

    <div class="header-tools">
      <input
        id="catalog-search"
        type="search"
        placeholder="Search exams..."
        aria-label="Search exams"
        autocomplete="off"
      >

      <label class="language-picker">
        <span class="sr-only">Language</span>
        <select id="language">
          <option value="en">English</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
        </select>
      </label>
    </div>
  </header>

  <main class="container">
    <section
      id="catalog"
      class="catalog"
      aria-live="polite"
    >
      <p class="muted">Loading exams...</p>
    </section>
  </main>

  <footer>
    <a href="/about.html">About</a>
    ·
    <a href="/privacy.html">Privacy</a>
    ·
    <a href="/contact.html">Contact</a>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
