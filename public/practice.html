<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice questions | Exam Practice</title>
<meta name="description" content="Practice exam questions with Exam Practice. Prepare for your test with free practice questions.">

<link id="canonical-url" rel="canonical" href="https://north-america-exam-practice.libbywu2023.workers.dev/practice.html">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Exam Practice">
<meta property="og:title" content="Practice questions | Exam Practice">
<meta property="og:description" content="Practice exam questions with Exam Practice. Prepare for your test with free practice questions.">
<meta property="og:url" content="https://north-america-exam-practice.libbywu2023.workers.dev/practice.html">
<meta property="og:locale" content="en_CA">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="/">Exam Practice</a><select id="language" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option></select></header>
<main class="container">
  <a class="back-link" href="/" id="back-link">← All exams</a>
<div class="progress-row">
  <span id="counter">Completed 0/0</span>
</div>
<div id="question-navigator" class="question-navigator" aria-label="Question navigation"></div>
  <section class="quiz-card">
    <div id="question-images" class="question-images" hidden aria-label="Question images"></div>
    <h1 id="question">Loading question…</h1>
    <form id="answer-form">
      <fieldset id="options"><legend id="choose-label">Choose one answer</legend></fieldset>
    </form>
    <div id="feedback" class="feedback" hidden aria-live="polite"></div>
<div class="nav-row">
  <button class="secondary" id="previous" type="button">Previous</button>
  <button class="secondary" id="retry" type="button">Retry</button>
  <button class="primary" id="next" type="button">Next</button>
</div>
  </section>
</main>

<dialog id="image-preview" class="image-preview">
  <button type="button" id="image-preview-close" class="image-preview-close" aria-label="Close image">×</button>
  <img id="image-preview-img" alt="">
</dialog>
<script type="module" src="/js/practice.js"></script>
</body>
</html>
