
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEO Test Tool | Exam Practice</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: #f7f8fa;
    }

    .seo-test-container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .seo-test-panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .seo-test-controls {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
      margin: 18px 0;
    }

    .seo-test-controls select,
    .seo-test-controls button {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      font-size: 14px;
    }

    .seo-test-controls button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .seo-test-controls button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .seo-test-results {
      display: grid;
      gap: 10px;
    }

    .seo-result {
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      padding: 13px;
      overflow-wrap: anywhere;
    }

    .seo-result-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .seo-result-value {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
    }

    .seo-status {
      font-size: 12px;
      white-space: nowrap;
    }

    .seo-pass { color: #15803d; }
    .seo-warn { color: #b45309; }
    .seo-fail { color: #dc2626; }

    #seo-summary {
      margin-top: 14px;
      font-weight: 600;
    }

    #seo-message {
      color: #6b7280;
      font-size: 14px;
    }

    #seo-frame {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 1200px;
      height: 800px;
      border: 0;
    }

    @media (max-width: 600px) {
      .seo-test-container {
        padding: 12px;
      }

      .seo-test-controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">Exam Practice</a>
  <span>SEO Test Tool</span>
</header>

<main class="seo-test-container">
  <section class="seo-test-panel">
    <h1>SEO Test Tool</h1>
    <p>Test the actual SEO tags generated by an exam practice page.</p>

    <div class="seo-test-controls">
      <select id="exam-select">
        <option value="">Loading exams...</option>
      </select>

      <select id="language-select">
        <option value="en">English</option>
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
      </select>
    </div>

    <div class="seo-test-controls">
      <button id="test-button" type="button">Run SEO Test</button>
      <button id="reload-button" type="button">Reload Exam List</button>
    </div>

    <p id="seo-message">Loading exam catalog...</p>
    <div id="seo-summary"></div>
  </section>

  <section class="seo-test-panel">
    <h2>SEO Test Results</h2>
    <div id="seo-results" class="seo-test-results">
      <p>Choose an exam and click Run SEO Test.</p>
    </div>
  </section>
</main>

<iframe id="seo-frame" title="SEO test page"></iframe>

<script type="module">
const examSelect = document.querySelector("#exam-select");
const languageSelect = document.querySelector("#language-select");
const testButton = document.querySelector("#test-button");
const reloadButton = document.querySelector("#reload-button");
const message = document.querySelector("#seo-message");
const results = document.querySelector("#seo-results");
const summary = document.querySelector("#seo-summary");
const frame = document.querySelector("#seo-frame");

let exams = [];

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function loadExams() {
  message.textContent = "Loading exam catalog...";
  examSelect.innerHTML = '<option value="">Loading...</option>';

  try {
    const response = await fetch(
      `/api/catalog?lang=${encodeURIComponent(languageSelect.value)}`
    );

    if (!response.ok) {
      throw new Error(`Catalog API returned HTTP ${response.status}`);
    }

    const data = await response.json();
    exams = data.exams || [];

    examSelect.innerHTML = "";

    if (!exams.length) {
      examSelect.innerHTML = '<option value="">No exams found</option>';
      message.textContent = "No published exams found.";
      return;
    }

    exams.forEach(exam => {
      const option = document.createElement("option");
      option.value = exam.slug;
      option.textContent = exam.title;
      examSelect.append(option);
    });

    message.textContent = `${exams.length} exams loaded successfully.`;
  } catch (error) {
    examSelect.innerHTML = '<option value="">Failed to load exams</option>';
    message.textContent = error.message;
  }
}

function addResult(name, value, status, statusClass) {
  const item = document.createElement("div");
  item.className = "seo-result";

  item.innerHTML = `
    <div class="seo-result-header">
      <span>${escapeHtml(name)}</span>
      <span class="seo-status ${statusClass}">${escapeHtml(status)}</span>
    </div>
    <div class="seo-result-value">${escapeHtml(value || "(empty)")}</div>
  `;

  results.append(item);
}

function getMeta(doc, selector, attribute = "content") {
  return doc.querySelector(selector)?.getAttribute(attribute) || "";
}

async function testSeo() {
  const slug = examSelect.value;
  const lang = languageSelect.value;

  if (!slug) {
    message.textContent = "Please select an exam first.";
    return;
  }

  testButton.disabled = true;
  results.innerHTML = "";
  summary.textContent = "";
  message.textContent = "Loading exam page and checking SEO...";

  try {
    const url = new URL("/practice.html", location.origin);
    url.searchParams.set("exam", slug);
    url.searchParams.set("lang", lang);

    await new Promise((resolve, reject) => {
      const timeout = setTimeout(
        () => reject(new Error("Exam page loading timed out.")),
        20000
      );

      frame.onload = () => {
        clearTimeout(timeout);
        resolve();
      };

      frame.onerror = () => {
        clearTimeout(timeout);
        reject(new Error("Failed to load exam page."));
      };

      frame.src = url.href;
    });

   const doc = frame.contentDocument;

if (!doc) {
  throw new Error("Cannot access exam page. Check same-origin access.");
}

// Wait for dynamic SEO tags to finish updating.
const expectedTitle =
  `${exams.find(x => x.slug === slug)?.title} | Exam Practice`;

const expectedCanonical =
  `https://north-america-exam-practice.libbywu2023.workers.dev/practice.html?exam=${encodeURIComponent(slug)}`;

const seoReady = await new Promise(resolve => {
  const startTime = Date.now();

  const timer = setInterval(() => {
    const titleReady = doc.title === expectedTitle;

    const canonicalReady =
      getMeta(doc, 'link[rel="canonical"]', "href") === expectedCanonical;

    if (titleReady && canonicalReady) {
      clearInterval(timer);
      resolve(true);
    } else if (Date.now() - startTime > 10000) {
      clearInterval(timer);
      resolve(false);
    }
  }, 100);
});

if (!seoReady) {
  throw new Error(
    `SEO tags did not update in time. Current title: ${doc.title}`
  );
}

    const actual = [
      {
        name: "HTML Title",
        value: doc.title,
        expected: `${exams.find(x => x.slug === slug)?.title} | Exam Practice`,
        required: true
      },
      {
        name: "Meta Description",
        value: getMeta(doc, 'meta[name="description"]'),
        expected: null,
        required: true
      },
      {
        name: "Canonical URL",
        value: getMeta(doc, 'link[rel="canonical"]', "href"),
        expected: `https://north-america-exam-practice.libbywu2023.workers.dev/practice.html?exam=${encodeURIComponent(slug)}`,
        required: true
      },
      {
        name: "OG Title",
        value: getMeta(doc, 'meta[property="og:title"]'),
        expected: `${exams.find(x => x.slug === slug)?.title} | Exam Practice`,
        required: true
      },
      {
        name: "OG Description",
        value: getMeta(doc, 'meta[property="og:description"]'),
        expected: null,
        required: true
      },
      {
        name: "OG URL",
        value: getMeta(doc, 'meta[property="og:url"]'),
        expected: null,
        required: true
      },
      {
        name: "OG Locale",
        value: getMeta(doc, 'meta[property="og:locale"]'),
        expected: {
          en: "en_CA",
          "zh-CN": "zh_CN",
          "zh-TW": "zh_TW"
        }[lang],
        required: true
      },
      {
        name: "HTML Language",
        value: doc.documentElement.lang,
        expected: lang,
        required: true
      }
    ];

    let passed = 0;
    let failed = 0;

    actual.forEach(item => {
      let status = "PASS";
      let statusClass = "seo-pass";

      if (!item.value) {
        status = "MISSING";
        statusClass = "seo-fail";
        failed++;
      } else if (item.expected && item.value !== item.expected) {
        status = "CHECK";
        statusClass = "seo-warn";
        failed++;
      } else {
        passed++;
      }

      addResult(
  item.name,
  `ACTUAL: ${item.value || "(empty)"}\nEXPECTED: ${item.expected ?? "(not specified)"}`,
  status,
  statusClass
);
    });

    summary.textContent =
      `${passed} passed / ${failed} need attention`;

    message.textContent =
      `Test completed: ${slug} (${lang}).`;
  } catch (error) {
    message.textContent = error.message;
    summary.textContent = "Test failed.";
  } finally {
    testButton.disabled = false;
  }
}

languageSelect.addEventListener("change", loadExams);
reloadButton.addEventListener("click", loadExams);
testButton.addEventListener("click", testSeo);

await loadExams();
</script>

</body>
</html>
